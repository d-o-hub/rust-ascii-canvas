name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filters keep quality left: only run expensive jobs for relevant changes.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      product: ${{ steps.filter.outputs.product }}
      harness: ${{ steps.filter.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
            web:
              - 'web/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
            harness:
              - 'scripts/**'
              - 'VERSION'
              - 'AGENTS.md'
              - 'agents-docs/**'
              - '.agents/**'
              - '.loc-allowlist'
              - '.github/workflows/**'
              - 'plans/**'
            product:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - 'web/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'scripts/**'
              - 'mise.toml'

  fmt:
    name: Format
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  architecture:
    name: Architecture Fitness
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Layer import rules + LOC
        run: |
          bash scripts/check-architecture.sh
          # LOC: fail only on non-allowlisted oversized files
          max=500
          failed=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            rel="${file#./}"
            if [ "$lines" -gt "$max" ]; then
              if grep -qxF "$rel" .loc-allowlist 2>/dev/null; then
                echo "WARN: $rel has $lines lines (allowlisted)"
              else
                echo "FAIL: $rel has $lines lines (max $max)"
                failed=1
              fi
            fi
          done < <(find ./src -name '*.rs' -type f | sort)
          exit $failed
      - name: Version pin parity
        run: bash scripts/propagate-version.sh --check

  rust:
    name: Rust (Build + Tests)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./->target

      - name: Build
        run: cargo build --all-targets

      - name: Run tests (Native)
        run: cargo test --all

      - name: Run tests (WASM)
        run: cargo test --all --target wasm32-unknown-unknown
        env:
          WASM_BINDGEN_TEST_ONLY_NODE: 1

  security:
    name: Security Audit
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Run cargo audit
        run: cargo audit

  deny:
    name: Dependency Policy (cargo-deny)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # WASM first: web/pkg is gitignored; tsc and e2e both need generated bindings.
  wasm:
    name: WASM Build
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.product == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./->target

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Build WASM
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:wasm

      - name: WASM size budget
        run: pnpm run check-size

      - name: Upload WASM
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: web/pkg

  web:
    name: Web (Lint + Types + Unit)
    needs: [changes, wasm]
    # web/pkg is gitignored — TypeScript imports ./pkg/ascii_canvas.js and needs the WASM artifact.
    if: >
      always() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.web == 'true' ||
       needs.changes.outputs.harness == 'true') &&
      needs.wasm.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Download WASM pkg (required for tsc)
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: web/pkg

      - name: ESLint
        working-directory: web
        run: pnpm run lint

      - name: TypeScript (strict)
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Vitest
        working-directory: web
        run: pnpm test

  e2e:
    name: E2E Tests (Playwright) - ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [changes, wasm]
    if: >
      always() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.product == 'true' ||
       needs.changes.outputs.web == 'true' ||
       needs.changes.outputs.harness == 'true') &&
      needs.wasm.result == 'success'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd web && pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install ${{ matrix.project }} --with-deps

      - name: Download WASM
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: web/pkg

      - name: Run E2E tests
        run: |
          cd web
          nohup pnpm run dev > /tmp/vite.log 2>&1 &
          echo "Waiting for dev server..."
          for i in {1..60}; do
            if curl -s http://localhost:3003 > /dev/null 2>&1; then
              echo "Dev server is ready"
              break
            fi
            sleep 1
          done
          cd ..
          npx playwright test --project=${{ matrix.project }} --timeout=120000
        env:
          CI: true

  pr-readiness:
    name: PR Readiness (merge gate)
    runs-on: ubuntu-latest
    # Deliberately NOT path-filtered: the merge contract is about PR metadata,
    # not file types, so this must report a verdict on every pull request.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # The self-test is the load-bearing part: it proves the merge contract's
      # predicates still block what they are supposed to block. Without it, a
      # refactor could silently turn the guard-rail into a rubber stamp.
      - name: Verify merge-gate logic (offline fixtures)
        run: bash scripts/pr-merge-gate.sh --self-test

      # Informational only. Enforcement of thread resolution lives in the
      # repository ruleset (required_review_thread_resolution: true), which
      # GitHub evaluates at merge time. A status check cannot do this job:
      # resolving a thread does not produce a new commit, so the check would
      # never re-run and would block merges on stale data.
      - name: Report PR readiness (advisory)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          bash scripts/pr-merge-gate.sh "$PR_NUMBER" --json > /tmp/gate.json 2>/tmp/gate.log
          jq . /tmp/gate.json > "$GITHUB_STEP_SUMMARY" 2>/dev/null || cat /tmp/gate.log >> "$GITHUB_STEP_SUMMARY"
          # Never fails the build: this step is a report, not a gate.
          exit 0

  ci-success:
    name: CI Success
    needs: [fmt, clippy, architecture, rust, security, deny, web, wasm, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          ARCHITECTURE: ${{ needs.architecture.result }}
          RUST: ${{ needs.rust.result }}
          SECURITY: ${{ needs.security.result }}
          DENY: ${{ needs.deny.result }}
          WEB: ${{ needs.web.result }}
          WASM: ${{ needs.wasm.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          set -uo pipefail
          declare -A results=(
            [fmt]="$FMT" [clippy]="$CLIPPY" [architecture]="$ARCHITECTURE"
            [rust]="$RUST" [security]="$SECURITY" [deny]="$DENY"
            [web]="$WEB" [wasm]="$WASM" [e2e]="$E2E"
          )
          blocked=0
          for job in "${!results[@]}"; do
            res="${results[$job]}"
            case "$res" in
              # 'skipped' is legitimate: path filters skip jobs for docs-only changes.
              success|skipped)
                echo "  $job: $res" ;;
              # 'cancelled' means unverified code. Concurrency cancellation always
              # triggers a fresh run on the new head, so failing here is safe — and
              # this job is a REQUIRED status check (harness L-008), so a cancelled
              # job must never read as "green". (ADR-044)
              failure|cancelled|"")
                echo "  $job: $res  <-- blocks merge"
                blocked=1 ;;
              *)
                echo "  $job: $res  <-- unknown result, blocks merge"
                blocked=1 ;;
            esac
          done
          if [[ "$blocked" -ne 0 ]]; then
            echo "::error::CI Success blocked: at least one required job did not pass."
            exit 1
          fi
          echo "All required CI jobs passed or were legitimately skipped."
