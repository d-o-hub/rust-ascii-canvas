name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filters keep quality left: only run expensive jobs for relevant changes.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      product: ${{ steps.filter.outputs.product }}
      harness: ${{ steps.filter.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
            web:
              - 'web/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
            harness:
              - 'scripts/**'
              - 'VERSION'
              - 'AGENTS.md'
              - 'agents-docs/**'
              - '.agents/**'
              - '.loc-allowlist'
              - '.github/workflows/**'
              - 'plans/**'
            product:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - 'web/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'scripts/**'
              - 'mise.toml'

  fmt:
    name: Format
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  architecture:
    name: Architecture Fitness
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Layer import rules
        run: bash scripts/check-architecture.sh
      # LOC used to be a second, inline implementation right here — a copy of the
      # loop that lived in quality-gates.sh, with its own hardcoded 500 and its
      # own allowlist lookup. It read `.loc-allowlist` with `grep -qxF "$rel"`,
      # so the moment check-loc.sh changed the entry format to `path=lines` this
      # copy stopped recognising the allowlist and failed on src/wasm/helpers.rs.
      # The failure was correct; the duplication was the bug (L-016, L-019, L-020).
      # One implementation now: scripts/check-loc.sh, run by the `web` job below.
      - name: Version pin parity
        run: bash scripts/propagate-version.sh --check

  rust:
    name: Rust (Build + Tests)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./->target

      - name: Build
        run: cargo build --all-targets

      - name: Run tests (Native)
        run: cargo test --all

      - name: Run tests (WASM, nonzero Node execution required)
        run: bash scripts/test-wasm.sh

  security:
    name: Security Audit (cargo)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-audit
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Run cargo audit
        run: cargo audit

  # LOC limits for src/**/*.rs AND web/*.ts.
  #
  # Its own job, because it is cross-cutting: putting it in `web` (gated on
  # `web/**`) would skip it for a Rust-only PR, and putting it in `architecture`
  # would skip it for a web-only PR. It needs no toolchain, so the job costs
  # seconds.
  #
  # This check existed three times before: inline in scripts/quality-gates.sh,
  # inline in the `architecture` job above, and nowhere in a web-aware form. The
  # inline copy in `architecture` read the allowlist with `grep -qxF "$rel"`, so
  # the moment scripts/check-loc.sh changed the entry format to `path=lines` it
  # stopped recognising the allowlist and failed on src/wasm/helpers.rs. The
  # failure was correct — the duplication was the bug. See L-016, L-019, L-020.
  loc:
    name: LOC Limits
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: LOC limits (src + web)
        run: bash scripts/check-loc.sh

  # npm advisories for BOTH lockfiles (harness L-013).
  #
  # A separate job, not a step inside `security`: that job is gated on
  # `needs.changes.outputs.rust == 'true'`, so on a web-only or lockfile-only PR
  # — exactly the change class this sensor exists for — it would be skipped and
  # the npm tree would go unchecked while CI stayed green. Gated on `web`
  # instead, which covers `web/**`, `e2e/**`, `package.json` and both
  # `pnpm-lock.yaml` files.
  security-npm:
    name: Security Audit (npm)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      # Audit the committed lockfiles. `--frozen-lockfile` proves the audit is
      # about what is actually pinned, not about a fresh resolve; if it fails
      # here the lockfile is out of sync with package.json, which is its own bug.
      - name: Install dependencies (frozen)
        run: |
          pnpm install --frozen-lockfile
          cd web && pnpm install --frozen-lockfile
      - name: Run npm audit (root + web)
        run: bash scripts/npm-audit.sh

  deny:
    name: Dependency Policy (cargo-deny)
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # WASM first: web/pkg is gitignored; tsc and e2e both need generated bindings.
  wasm:
    name: WASM Build
    needs: [changes]
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.product == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./->target

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Build WASM
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:wasm

      - name: WASM size budget
        run: pnpm run check-size

      - name: Upload WASM
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: web/pkg

  web:
    name: Web (Lint + Types + Unit)
    needs: [changes, wasm]
    # web/pkg is gitignored — TypeScript imports ./pkg/ascii_canvas.js and needs the WASM artifact.
    if: >
      always() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.web == 'true' ||
       needs.changes.outputs.harness == 'true') &&
      needs.wasm.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Root workspace deps (eslint, typescript-eslint, @playwright/test,
      # @types/node). Needed by the root ESLint + e2e typecheck steps below,
      # which cover e2e/ — that directory is outside web/ and was previously
      # unlinted and untype-checked in CI (harness L-014).
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Download WASM pkg (required for tsc)
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: web/pkg

      - name: ESLint
        working-directory: web
        run: pnpm run lint

      - name: TypeScript (strict)
        working-directory: web
        run: pnpm exec tsc --noEmit

      # Root config ignores web/, so these do not duplicate the steps above.
      - name: ESLint (root — covers e2e/)
        run: pnpm exec eslint .

      # Uses web's tsc deliberately: `typescript` is not a root dependency (it is
      # aliased to the TypeScript 6 preview in `web/package.json`). `pnpm exec
      # tsc` at the root only resolves when a hoisted copy happens to be linked
      # — in a clean pnpm-10 install it fails with
      # ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL (verified, exit 254). Reusing web's
      # compiler keeps a single TypeScript version in the project instead of
      # adding a second one at the root.
      - name: TypeScript (e2e)
        run: web/node_modules/.bin/tsc --noEmit -p e2e/tsconfig.json

      - name: Vitest
        working-directory: web
        run: pnpm test

  e2e:
    name: E2E Tests (Playwright) - ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [changes, wasm]
    if: >
      always() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.product == 'true' ||
       needs.changes.outputs.web == 'true' ||
       needs.changes.outputs.harness == 'true') &&
      needs.wasm.result == 'success'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd web && pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install ${{ matrix.project }} --with-deps

      - name: Download WASM
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: web/pkg

      # The dev server is started, awaited and torn down by Playwright's
      # `webServer` in playwright.config.ts — the single source of truth, also
      # used by `npm run gate:full`.
      #
      # This step used to hand-roll it: `nohup pnpm run dev` plus a
      # `for i in {1..60}` readiness poll that `break`s when the server is ready
      # but never `exit 1` when it is not. So a dev server that failed to boot
      # produced a three-minute Playwright timeout pointing at the tests instead
      # of at the cause. `webServer` fails at the point of failure, and
      # `reuseExistingServer: false` (CI sets CI=true) makes it *throw* if
      # something already holds the port, rather than testing a stale server.
      #
      # `web/pkg` must exist before this point: the WASM bindings are gitignored
      # (harness L-001) and the job downloads the artifact above.
      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.project }} --timeout=120000
        env:
          CI: true

  pr-readiness:
    name: PR Readiness (merge gate)
    runs-on: ubuntu-latest
    # Deliberately NOT path-filtered: the merge contract is about PR metadata,
    # not file types, so this must report a verdict on every pull request.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # The self-test is the load-bearing part: it proves the merge contract's
      # predicates still block what they are supposed to block. Without it, a
      # refactor could silently turn the guard-rail into a rubber stamp.
      - name: Verify merge-gate logic (offline fixtures)
        run: bash scripts/pr-merge-gate.sh --self-test

      # The merge contract lives in repository state, not in git, so it needs its
      # own guard: a ruleset weakened in the GitHub UI (or by a script) is
      # invisible to every other sensor and to code review. The committed
      # snapshot makes that change show up here as a required check.
      - name: Merge contract has not drifted
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ruleset-check.sh

      # Informational only. Enforcement of thread resolution lives in the
      # repository ruleset (required_review_thread_resolution: true), which
      # GitHub evaluates at merge time. A status check cannot do this job:
      # resolving a thread does not produce a new commit, so the check would
      # never re-run and would block merges on stale data.
      - name: Report PR readiness (advisory)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          bash scripts/pr-merge-gate.sh "$PR_NUMBER" --json > /tmp/gate.json 2>/tmp/gate.log
          jq . /tmp/gate.json > "$GITHUB_STEP_SUMMARY" 2>/dev/null || cat /tmp/gate.log >> "$GITHUB_STEP_SUMMARY"
          # Never fails the build: this step is a report, not a gate.
          exit 0

  ci-success:
    name: CI Success
    # `changes` MUST be listed here. If the Detect Changes job fails, GitHub
    # skips every dependant — and this job would then see nine `skipped`
    # results and report green. That is the L-002/L-003 trap reproduced inside
    # the very check that gates merges, so the upstream job is verified too.
    needs: [changes, fmt, clippy, architecture, rust, security, security-npm, deny, loc, web, wasm, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          ARCHITECTURE: ${{ needs.architecture.result }}
          RUST: ${{ needs.rust.result }}
          SECURITY: ${{ needs.security.result }}
          SECURITY_NPM: ${{ needs.security-npm.result }}
          DENY: ${{ needs.deny.result }}
          LOC: ${{ needs.loc.result }}
          WEB: ${{ needs.web.result }}
          WASM: ${{ needs.wasm.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          set -uo pipefail
          declare -A results=(
            [changes]="$CHANGES" [fmt]="$FMT" [clippy]="$CLIPPY"
            [architecture]="$ARCHITECTURE" [rust]="$RUST" [security]="$SECURITY"
            [security-npm]="$SECURITY_NPM" [loc]="$LOC"
            [deny]="$DENY" [web]="$WEB" [wasm]="$WASM" [e2e]="$E2E"
          )
          blocked=0
          for job in "${!results[@]}"; do
            res="${results[$job]}"
            case "$res" in
              success)
                echo "  $job: $res" ;;
              # 'skipped' is legitimate ONLY for the sensor jobs: path filters skip
              # them on docs-only changes. `changes` never has a skip path — if it
              # is skipped, the detection step did not run and nothing is verified.
              skipped)
                if [[ "$job" == "changes" ]]; then
                  echo "  $job: $res  <-- detection did not run; blocks merge"
                  blocked=1
                else
                  echo "  $job: $res (path filter)"
                fi ;;
              # 'cancelled' means unverified code. Concurrency cancellation always
              # triggers a fresh run on the new head, so failing here is safe — and
              # this job is a REQUIRED status check (harness L-008), so a cancelled
              # job must never read as "green". (ADR-044)
              failure|cancelled|"")
                echo "  $job: $res  <-- blocks merge"
                blocked=1 ;;
              *)
                echo "  $job: $res  <-- unknown result, blocks merge"
                blocked=1 ;;
            esac
          done
          if [[ "$blocked" -ne 0 ]]; then
            echo "::error::CI Success blocked: at least one required job did not pass."
            exit 1
          fi
          echo "All required CI jobs passed or were legitimately skipped."
